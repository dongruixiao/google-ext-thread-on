<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TopClip · 读长文，不掉线</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #28261f;
        --muted: rgb(40 38 31 / 58%);
        --bg: #faf8f2;
        --card: rgb(40 38 31 / 5%);
        --recess: #202126;
        --border: rgb(40 38 31 / 14%);
        --accent: #6c4df6;
        --accent-soft: rgb(108 77 246 / 10%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f0ece4;
          --muted: rgb(240 236 228 / 58%);
          --bg: #1c1d22;
          --card: rgb(255 255 255 / 6%);
          --recess: #101114;
          --border: rgb(255 255 255 / 14%);
          --accent: #b1a1ff;
          --accent-soft: rgb(177 161 255 / 12%);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 304px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .logo {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 10px;
      }

      h1 {
        margin: 0;
        font-size: 14px;
        line-height: 1.2;
      }

      header p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 11px;
      }

      .status {
        margin-bottom: 9px;
        padding: 8px 10px;
        border-radius: 9px;
        background: var(--recess);
        color: rgb(242 238 229 / 68%);
        font-size: 11.5px;
        line-height: 1.45;
      }

      .status strong {
        color: #f6f2e9;
        font-weight: 600;
      }

      .status[data-stale='true'] {
        color: #f0c98a;
      }

      .status .current {
        display: block;
        max-width: 250px;
        overflow: hidden;
        color: #f6f2e9;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .row > span {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .row small {
        color: var(--muted);
        font-size: 10.5px;
      }

      select {
        max-width: 116px;
        padding: 5px 7px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: inherit;
        font: inherit;
      }

      .switch input {
        appearance: none;
        position: relative;
        width: 36px;
        height: 20px;
        flex: none;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--card);
        cursor: pointer;
      }

      .switch input::after {
        content: '';
        position: absolute;
        top: 1px;
        left: 1px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--muted);
        transition: translate 0.15s ease, background-color 0.15s ease;
      }

      .switch input:checked {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .switch input:checked::after {
        translate: 16px 0;
        background: var(--accent);
      }

      button {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 11px;
        color: var(--muted);
        font-size: 10.5px;
      }

      .link {
        width: auto;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--accent);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <img class="logo" src="../../icons/icon48.png" alt="" width="34" height="34" />
      <div>
        <h1>TopClip</h1>
        <p>读长文，不掉线</p>
      </div>
    </header>

    <div class="status" id="status">正在检测当前页面…</div>

    <label class="row switch">
      <span>
        开启 TopClip
        <small>关闭后所有页面都不显示</small>
      </span>
      <input id="enabled" type="checkbox" />
    </label>

    <label class="row">
      <span>
        显示方式
        <small id="policyHint">向下滚动浮现，向上滚动让位</small>
      </span>
      <select id="displayPolicy">
        <option value="smart">智能</option>
        <option value="always">常驻</option>
      </select>
    </label>

    <button id="site" type="button">在此站点禁用</button>

    <footer>
      <button class="link" id="options" type="button">设置</button>
      <span id="version"></span>
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
