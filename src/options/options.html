<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TopClip · 设置</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #28261f;
        --muted: rgb(40 38 31 / 58%);
        --bg: #ece9e1;
        --panel: #faf8f2;
        --recess: #202126;
        --border: rgb(40 38 31 / 15%);
        --accent: #6c4df6;
        --accent-soft: rgb(108 77 246 / 10%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f0ece4;
          --muted: rgb(240 236 228 / 58%);
          --bg: #17181c;
          --panel: #24252a;
          --recess: #101114;
          --border: rgb(255 255 255 / 14%);
          --accent: #b1a1ff;
          --accent-soft: rgb(177 161 255 / 12%);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px 20px 80px;
        background:
          repeating-linear-gradient(105deg, rgb(255 255 255 / 12%) 0 1px, transparent 1px 4px),
          radial-gradient(70% 60% at 78% 12%, rgb(205 191 164 / 24%), transparent 70%),
          var(--bg);
        color: var(--fg);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }

      .wrap {
        width: min(100%, 560px);
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-bottom: 20px;
      }

      .logo {
        width: 48px;
        height: 48px;
        flex: none;
        border-radius: 14px;
        box-shadow:
          0 1px 0 rgb(255 255 255 / 38%),
          0 12px 24px -16px rgb(20 18 14 / 65%);
      }

      h1 {
        margin: 0;
        font-size: 19px;
        line-height: 1.2;
      }

      header p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12.5px;
      }

      section {
        margin-bottom: 14px;
        padding: 18px 20px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--panel);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 30%),
          0 15px 28px -24px rgb(20 18 14 / 55%);
      }

      h2 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 0;
        border-top: 1px solid var(--border);
      }

      .row:first-of-type {
        padding-top: 2px;
        border-top: 0;
      }

      .label {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      small,
      .note {
        color: var(--muted);
        font-size: 12px;
      }

      select {
        flex: none;
        padding: 6px 28px 6px 9px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--accent-soft);
        color: inherit;
        font: inherit;
      }

      .switch input {
        appearance: none;
        position: relative;
        width: 42px;
        height: 23px;
        flex: none;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgb(40 38 31 / 8%);
        cursor: pointer;
      }

      .switch input::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: var(--muted);
        transition: translate 0.15s ease, background-color 0.15s ease;
      }

      .switch input:checked {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .switch input:checked::after {
        translate: 19px 0;
        background: var(--accent);
      }

      .note {
        margin: 10px 0 0;
        padding: 11px 12px;
        border-radius: 10px;
        background: var(--recess);
        color: rgb(242 238 229 / 66%);
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 11.5px;
      }

      button {
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--panel);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        translate: -50% 12px;
        padding: 7px 15px;
        border-radius: 999px;
        background: var(--recess);
        color: #f4f0e8;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease, translate 0.18s ease;
      }

      .toast.show {
        opacity: 1;
        translate: -50% 0;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <img class="logo" src="../../icons/icon48.png" alt="" width="48" height="48" />
        <div>
          <h1>TopClip</h1>
          <p>读长文，不掉线</p>
        </div>
      </header>

      <section>
        <h2>阅读设置</h2>
        <label class="row switch">
          <span class="label">
            开启 TopClip
            <small>关闭后所有网页都不显示胶囊</small>
          </span>
          <input id="enabled" type="checkbox" />
        </label>
        <label class="row">
          <span class="label">
            显示方式
            <small>智能会在向上回看时让出空间</small>
          </span>
          <select id="displayPolicy">
            <option value="smart">智能</option>
            <option value="always">常驻</option>
          </select>
        </label>
        <p class="note">在网页中直接拖动胶囊调整位置，双击恢复默认位置。原站已有目录时，TopClip 会自动退让。</p>
      </section>

      <footer>
        <button id="reset" type="button">恢复默认设置</button>
        <span id="version"></span>
      </footer>
    </main>

    <div class="toast" id="toast">已保存</div>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
