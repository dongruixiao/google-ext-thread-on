<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>顶阅 · 设置</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #0f172a;
        --muted: rgba(15, 23, 42, 0.6);
        --bg: #f6f7fb;
        --panel: #ffffff;
        --card: rgba(15, 23, 42, 0.03);
        --border: rgba(15, 23, 42, 0.12);
        --accent: #4f46e5;
        --accent-soft: rgba(79, 70, 229, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e9eaf3;
          --muted: rgba(233, 234, 243, 0.6);
          --bg: #101218;
          --panel: #171a22;
          --card: rgba(255, 255, 255, 0.05);
          --border: rgba(255, 255, 255, 0.14);
          --accent: #8b8cf9;
          --accent-soft: rgba(139, 140, 249, 0.14);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 20px 80px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }

      .wrap {
        max-width: 720px;
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .logo {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(140deg, #4f46e5, #7c3aed);
        color: #fff;
        flex: none;
      }

      h1 {
        margin: 0;
        font-size: 17px;
      }

      header p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12.5px;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 20px;
        margin-bottom: 16px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        border-top: 1px solid var(--border);
      }

      .row:first-of-type {
        border-top: 0;
        padding-top: 0;
      }

      .row > .label {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .row small,
      .hint {
        color: var(--muted);
        font-size: 12px;
      }

      select,
      input[type='number'],
      input[type='text'],
      textarea {
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 6px 8px;
      }

      input[type='number'] {
        width: 76px;
        text-align: right;
      }

      textarea {
        width: 100%;
        min-height: 96px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        resize: vertical;
      }

      .switch input {
        appearance: none;
        width: 40px;
        height: 22px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        position: relative;
        cursor: pointer;
        flex: none;
      }

      .switch input::after {
        content: '';
        position: absolute;
        top: 1px;
        left: 1px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--muted);
        transition: translate 0.15s ease, background-color 0.15s ease;
      }

      .switch input:checked {
        background: var(--accent-soft);
        border-color: var(--accent);
      }

      .switch input:checked::after {
        translate: 18px 0;
        background: var(--accent);
      }

      button {
        font: inherit;
        padding: 7px 12px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .site-add {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .site-add input {
        flex: 1;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        translate: -50% 12px;
        padding: 8px 16px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 12.5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, translate 0.2s ease;
      }

      .toast.show {
        opacity: 1;
        translate: -50% 0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">
          <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M2.75 4h10.5M2.75 8h7.5M2.75 12h4.5"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              fill="none"
            />
          </svg>
        </div>
        <div>
          <h1>顶阅 · 设置</h1>
          <p>所有改动即时保存，并同步到已打开的文章页。</p>
        </div>
      </header>

      <section>
        <h2>基础</h2>
        <label class="row switch">
          <span class="label">启用吸顶面包屑</span>
          <input id="enabled" type="checkbox" />
        </label>
        <label class="row">
          <span class="label">
            外观形态
            <small>吸顶条贴着顶栏、配色取自页面；悬浮胶囊是小巧的毛玻璃控件</small>
          </span>
          <select id="appearance">
            <option value="bar">吸顶条（推荐）</option>
            <option value="pill">悬浮胶囊</option>
          </select>
        </label>
        <label class="row">
          <span class="label">
            吸顶条宽度
            <small>满宽像第二个页面顶栏；列宽只覆盖正文那一列</small>
          </span>
          <select id="barWidth">
            <option value="full">满宽（与正文列对齐文字）</option>
            <option value="column">与正文列同宽</option>
          </select>
        </label>
        <label class="row">
          <span class="label">悬浮位置</span>
          <select id="position">
            <option value="top-center">顶部居中</option>
            <option value="top-right">右上角</option>
          </select>
        </label>
        <label class="row">
          <span class="label">外观主题</span>
          <select id="theme">
            <option value="auto">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
        <label class="row">
          <span class="label">
            垂直微调
            <small>在自动避让固定导航栏的基础上再下移若干像素</small>
          </span>
          <input id="offsetY" type="number" step="2" min="-20" max="400" />
        </label>
      </section>

      <section>
        <h2>显示</h2>
        <label class="row">
          <span class="label">
            显示策略
            <small>决定胶囊什么时候出现，直接影响正文遮挡程度</small>
          </span>
          <select id="displayPolicy">
            <option value="smart">智能（推荐）</option>
            <option value="always">常驻</option>
            <option value="peek">轻提示</option>
          </select>
        </label>
        <label class="row switch">
          <span class="label">
            不显示文章大标题
            <small>面包屑从二级标题开始，例如「实现方式 › 边界处理」</small>
          </span>
          <input id="hideArticleTitle" type="checkbox" />
        </label>
        <label class="row">
          <span class="label">
            最多显示层级
            <small>超出的上级标题折叠为 …，悬停胶囊时展开</small>
          </span>
          <select id="maxCrumbs">
            <option value="1">1 级（只看当前小节）</option>
            <option value="2">2 级</option>
            <option value="3">3 级</option>
            <option value="4">4 级</option>
            <option value="5">5 级</option>
            <option value="6">6 级</option>
          </select>
        </label>
        <label class="row">
          <span class="label">
            原站已有目录时
            <small>页面自带目录若正在屏幕上，插件退让为「当前小节」指示器</small>
          </span>
          <select id="pageTocMode">
            <option value="adapt">自动退让</option>
            <option value="full">保持完整功能</option>
          </select>
        </label>
      </section>

      <section>
        <h2>站点规则</h2>
        <label class="row">
          <span class="label">生效范围</span>
          <select id="siteAccess">
            <option value="all">所有网站</option>
            <option value="blocklist">除下列网站外都生效</option>
            <option value="allowlist">仅在下列网站生效</option>
          </select>
        </label>
        <div class="row" style="display: block">
          <span class="label">
            站点列表
            <small>每行一个域名，example.com 同时覆盖其子域名</small>
          </span>
          <textarea id="sites" spellcheck="false" placeholder="example.com&#10;news.ycombinator.com"></textarea>
          <div class="site-add">
            <input id="siteInput" type="text" placeholder="example.com" />
            <button id="addSite" type="button">添加域名</button>
            <button id="addCurrentSite" type="button">添加当前站点</button>
          </div>
        </div>
      </section>

      <section>
        <h2>数据</h2>
        <div class="row" style="display: block">
          <span class="label">
            导出 / 导入
            <small>粘贴 JSON 后点击「导入设置」即可覆盖当前配置</small>
          </span>
          <textarea id="data" spellcheck="false"></textarea>
          <div class="actions" style="margin-top: 10px">
            <button id="exportData" type="button">导出到文本框</button>
            <button id="importData" type="button">导入设置</button>
            <button id="reset" type="button" class="primary">恢复默认</button>
          </div>
        </div>
      </section>
    </div>

    <div class="toast" id="toast">已保存</div>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
